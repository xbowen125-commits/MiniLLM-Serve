name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test tools
        run: python -m pip install --constraint constraints-container.txt --editable ".[dev]"
      - name: Validate sources and deployment files
        run: |
          python -m compileall -q src tests benchmarks scripts
          python -m pytest -m "not slow" -q
